services:
  database:
    image: mysql:8.4
    command: [ "--max_connections=1000" ]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 'ChangeMe'
      MYSQL_DATABASE: 'sulu_redirect_test'
      MYSQL_ROOT_HOST: '%'
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pChangeMe" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sulu-redirect-mysql84-data:/var/lib/mysql

volumes:
  sulu-redirect-mysql84-data:
