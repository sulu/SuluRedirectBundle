services:
  database:
    image: postgres:14-alpine
    command: postgres -c 'max_connections=1000' # fix failed: FATAL: sorry, too many clients already
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: 'sulu_redirect_test'
      POSTGRES_USER: 'symfony'
      POSTGRES_PASSWORD: 'ChangeMe'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U symfony -d sulu_redirect_test" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sulu-redirect-postgres14-data:/var/lib/postgresql/data:rw

volumes:
  sulu-redirect-postgres14-data:
